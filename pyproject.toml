[project]
name = "alarm-clock"
version = "0.1.0"
description = "A local command-line alarm clock"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
alarm-clock = "alarm_clock.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alarm_clock"]
